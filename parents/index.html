<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="app-version" content="v1.0">
<title>쉬운 인터넷</title>
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"Malgun Gothic","맑은 고딕",sans-serif;background:#eef0f3;color:#111;
    display:flex;flex-direction:column;word-break:keep-all;user-select:none;overflow:hidden}
  header{display:flex;align-items:center;justify-content:space-between;gap:20px;
    padding:14px 28px;background:#fff;border-bottom:2px solid #d5d9e0}
  .hl{display:flex;align-items:baseline;gap:22px;flex-wrap:wrap}
  h1{font-size:44px;font-weight:800;letter-spacing:-1px;white-space:nowrap}
  .ver{font-size:17px;color:#444;font-weight:600;white-space:nowrap}
  .clock{text-align:right;white-space:nowrap}
  .clock .d{font-size:28px;font-weight:700}
  .clock .t{font-size:44px;font-weight:800;line-height:1.1}
  main{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);
    gap:22px;padding:22px 28px 26px;min-height:0}
  a.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    border-radius:28px;text-decoration:none;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.18);
    border:4px solid transparent;transition:transform .08s;min-height:0;padding:10px}
  a.tile:hover{border-color:#111;transform:translateY(-3px)}
  a.tile:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
  .ic{width:min(15vh,13vw);height:min(15vh,13vw);display:flex;align-items:center;justify-content:center}
  .ic svg{width:100%;height:100%}
  .nm{font-size:min(7.2vh,4.6vw);font-weight:800;letter-spacing:-1px;line-height:1.1;text-align:center}
  .ds{font-size:min(3.4vh,2.1vw);font-weight:700;opacity:.95;text-align:center}
  .yt{background:#e62117}.nv{background:#03a94f}a.tile.gg{background:#fff;color:#1a1a1a;border-color:#c8ccd3}
  a.tile.kk{background:#fee500;color:#191919}.wt{background:#1c7ed6}.nw{background:#25324d}
  .tr{background:#a3339b}.mp{background:#0b8c84}
  #msg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:9}
  #msg div{background:#fff;border-radius:24px;padding:40px 60px;font-size:48px;font-weight:800;text-align:center}
  #msg small{display:block;font-size:26px;font-weight:700;color:#333;margin-top:14px}
</style>
</head>
<body>
<header>
  <div class="hl">
    <h1>보고 싶은 곳을 한 번 눌러 주세요</h1>
    <span class="ver">v1.0 · 2026-11-24 20:10 업데이트</span>
  </div>
  <div class="clock"><div class="d" id="d"></div><div class="t" id="t"></div></div>
</header>
<main>
  <a class="tile yt" href="https://www.youtube.com/" data-name="유튜브">
    <span class="ic"><svg viewBox="0 0 100 100"><rect x="6" y="20" width="88" height="60" rx="18" fill="#fff"/><path d="M42 36 L66 50 L42 64Z" fill="#e62117"/></svg></span>
    <span class="nm">유튜브</span><span class="ds">동영상 보기</span></a>
  <a class="tile nv" href="https://www.naver.com/" data-name="네이버">
    <span class="ic"><svg viewBox="0 0 100 100"><rect x="8" y="8" width="84" height="84" rx="18" fill="#fff"/><path d="M28 26h15l15 22V26h14v48H57L43 52v22H28z" fill="#03a94f"/></svg></span>
    <span class="nm">네이버</span><span class="ds">검색 · 소식</span></a>
  <a class="tile gg" href="https://www.google.co.kr/" data-name="구글">
    <span class="ic"><svg viewBox="0 0 100 100"><path d="M90 51c0-3-.3-5.8-.8-8.5H50v16.2h22.4c-1 5.2-4 9.6-8.4 12.6v10.4h13.6C85.4 74.5 90 63.8 90 51z" fill="#4285f4"/><path d="M50 92c11.3 0 20.8-3.7 27.6-10.2L64 71.3c-3.7 2.5-8.5 4-14 4-10.8 0-19.9-7.3-23.2-17H12.8v10.7C19.6 82.6 33.8 92 50 92z" fill="#34a853"/><path d="M26.8 58.3c-.8-2.5-1.3-5.2-1.3-8s.5-5.5 1.3-8V31.6H12.8C10 37.2 8.4 43.6 8.4 50.3s1.6 13.1 4.4 18.7z" fill="#fbbc05"/><path d="M50 25.4c6.1 0 11.6 2.1 15.9 6.2l11.9-11.9C70.8 13.1 61.3 8.6 50 8.6c-16.2 0-30.4 9.4-37.2 23l14 10.7c3.3-9.7 12.4-16.9 23.2-16.9z" fill="#ea4335"/></svg></span>
    <span class="nm">구글</span><span class="ds">검색하기</span></a>
  <a class="tile kk" href="jojokakao://open" data-name="카카오톡">
    <span class="ic"><svg viewBox="0 0 100 100"><path d="M50 14C26 14 8 28.5 8 46.5c0 11.6 7.7 21.7 19.3 27.5L23 90l18.5-12.3c2.8.4 5.6.6 8.5.6 24 0 42-14.5 42-32.5S74 14 50 14z" fill="#3c1e1e"/><text x="50" y="55" font-size="18" font-weight="900" fill="#fee500" text-anchor="middle" font-family="Arial">TALK</text></svg></span>
    <span class="nm">카카오톡</span><span class="ds">대화 · 사진 보기</span></a>
  <a class="tile wt" href="https://weather.naver.com/" data-name="날씨">
    <span class="ic"><svg viewBox="0 0 100 100"><circle cx="38" cy="38" r="18" fill="#ffd43b"/><path d="M30 80h46a16 16 0 0 0 0-32 22 22 0 0 0-42 6A13 13 0 0 0 30 80z" fill="#fff"/></svg></span>
    <span class="nm">날씨</span><span class="ds">오늘 · 내일 날씨</span></a>
  <a class="tile nw" href="https://news.naver.com/" data-name="뉴스">
    <span class="ic"><svg viewBox="0 0 100 100"><rect x="10" y="16" width="80" height="68" rx="10" fill="#fff"/><rect x="20" y="28" width="60" height="12" fill="#25324d"/><rect x="20" y="48" width="26" height="24" fill="#9aa6bf"/><rect x="52" y="48" width="28" height="6" fill="#25324d"/><rect x="52" y="60" width="28" height="6" fill="#25324d"/></svg></span>
    <span class="nm">뉴스</span><span class="ds">오늘 소식</span></a>
  <a class="tile tr" href="https://www.youtube.com/results?search_query=%ED%8A%B8%EB%A1%9C%ED%8A%B8+%EB%85%B8%EB%9E%98%EB%AA%A8%EC%9D%8C" data-name="트로트 노래">
    <span class="ic"><svg viewBox="0 0 100 100"><path d="M38 18v46a14 14 0 1 0 8 13V36l34-8v28a14 14 0 1 0 8 13V10z" fill="#fff"/></svg></span>
    <span class="nm">트로트 노래</span><span class="ds">노래 모음 듣기</span></a>
  <a class="tile mp" href="https://map.naver.com/" data-name="지도">
    <span class="ic"><svg viewBox="0 0 100 100"><path d="M50 8a28 28 0 0 0-28 28c0 21 28 56 28 56s28-35 28-56A28 28 0 0 0 50 8z" fill="#fff"/><circle cx="50" cy="36" r="11" fill="#0b8c84"/></svg></span>
    <span class="nm">지도</span><span class="ds">길 찾기</span></a>
</main>
<div id="msg"><div><span id="mt">열고 있어요</span><small>잠시만 기다려 주세요</small></div></div>
<script>
  var W=['일','월','화','수','목','금','토'];
  function tick(){var n=new Date();
    document.getElementById('d').textContent=(n.getMonth()+1)+'월 '+n.getDate()+'일 '+W[n.getDay()]+'요일';
    var h=n.getHours(),m=n.getMinutes();
    document.getElementById('t').textContent=(h<12?'오전 ':'오후 ')+((h%12)||12)+':'+(m<10?'0':'')+m;}
  tick();setInterval(tick,10000);
  var busy=false,msg=document.getElementById('msg');
  document.querySelectorAll('a.tile').forEach(function(a){
    a.addEventListener('click',function(e){
      e.preventDefault();
      if(busy)return;            // 두 번 눌러도 한 번만 열기
      busy=true;
      document.getElementById('mt').textContent=a.dataset.name+' 여는 중';
      msg.style.display='flex';
      if(a.href.indexOf('jojokakao:')===0){location.href=a.href;}
      else{window.open(a.href,'_blank');}
      setTimeout(function(){msg.style.display='none';busy=false;},2500);
    });
  });
</script>
</body>
</html>
